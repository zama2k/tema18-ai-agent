# Prometheus configuration for the AI agent.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: ai-agent

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ai-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8000"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
