# Alertmanager for local tests: same routing and templates as alertmanager.yml, but notifications
# go to the local webhook receiver (Discord-shaped on /discord, generic on /webhook) and the
# timers are short so a test finishes in seconds.
global:
  resolve_timeout: 5m

route:
  receiver: local
  group_by: [alertname, severity]
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1h

inhibit_rules:
  - source_matchers: [alertname="AgentDown"]
    target_matchers: [severity=~"warning|critical|info"]
    equal: [service]

receivers:
  - name: local
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        message: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook }}
          {{ end }}
    webhook_configs:
      - url: http://webhook-receiver:9099/webhook
        send_resolved: true
