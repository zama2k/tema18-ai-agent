# Alertmanager: production routing. Everything goes to Discord; the webhook URL is a secret read
# from a file (webhook_url_file) so it never appears in this repository or in `docker inspect`.
#   mkdir -p monitoring/secrets && printf '%s' "$DISCORD_WEBHOOK_URL" > monitoring/secrets/discord_webhook_url
global:
  resolve_timeout: 5m

route:
  receiver: discord
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: discord
      repeat_interval: 1h

inhibit_rules:
  # When the agent is down every other alert is noise.
  - source_matchers: [alertname="AgentDown"]
    target_matchers: [severity=~"warning|critical|info"]
    equal: [service]

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook_url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        message: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          Runbook: {{ .Annotations.runbook }}
          {{ end }}
