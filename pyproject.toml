[project]
name = "ai-agent"
version = "0.1.0"
description = "Async tool-calling AI agent with CI/CD, LLM quality gates and blue/green deployment"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "D"]
ignore = ["D105", "D107"]  # magic methods and __init__: documented on the class (Google style)

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"monitoring/*.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests", "evals"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: calls real external APIs (Azure OpenAI, Tavily); needs credentials",
    "slow: takes more than 10 seconds",
]
# Integration tests are opt-in: run them with `-m integration`.
addopts = "-ra --strict-markers -m 'not integration'"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
